  deploy-to-ec2:
    name: Deploy to EC2
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    environment: TacticAI
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -eux
            TARGET_DIR=${{ secrets.EC2_PATH || '/home/ubuntu/tacticai' }}

            if [ -d "$TARGET_DIR/.git" ]; then
              cd "$TARGET_DIR" && git fetch --all && git reset --hard origin/develop
            else
              rm -rf "$TARGET_DIR" || true
              git clone --branch develop --single-branch https://github.com/${{ github.repository }} "$TARGET_DIR"
            fi

            # If ENV_B64 secret is provided, restore .env safely
            if [ -n "${{ secrets.ENV_B64 || '' }}" ]; then
              echo "Restoring .env file..."
              # Ensure target directory exists
              mkdir -p "$TARGET_DIR"
              # Write to temp file to avoid pipe issues with long secrets
              printf '%s' "${{ secrets.ENV_B64 }}" > /tmp/env_b64.tmp
              # Decode with explicit error handling
              if ! base64 -d /tmp/env_b64.tmp > "$TARGET_DIR/.env" 2>/tmp/base64_error.log; then
                echo "ERROR: base64 decode failed. Check ENV_B64 secret is valid base64 (UTF-8, no headers/footers)."
                cat /tmp/base64_error.log || true
                rm -f /tmp/env_b64.tmp /tmp/base64_error.log
                exit 1
              fi
              rm -f /tmp/env_b64.tmp
              echo ".env restored successfully ($(stat -c%s "$TARGET_DIR/.env") bytes)"
            else
              echo "ENV_B64 not set, skipping .env restore"
            fi

            # Ensure docker is running
            if ! sudo systemctl is-active --quiet docker; then
              sudo systemctl start docker
            fi

            # Change to target directory for docker compose commands
            cd "$TARGET_DIR"
            
            # Use docker compose with relative path (we're already in TARGET_DIR)
            sudo docker compose pull || true
            sudo docker compose up -d --build

            # Cleanup images
            sudo docker image prune -f
