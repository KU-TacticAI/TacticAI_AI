  deploy-to-ec2:
    name: Deploy to EC2
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        # Validate required secrets first so we get a clear error instead of the action's generic "missing server host"
      - name: Validate EC2 secrets
        run: |
          set -eux
          if [ -z "${{ secrets.EC2_HOST || '' }}" ]; then
            echo "ERROR: EC2_HOST secret is not set. Please add repository secret 'EC2_HOST' (EC2 IP or hostname)."
            exit 1
          fi
          if [ -z "${{ secrets.EC2_USER || '' }}" ]; then
            echo "ERROR: EC2_USER secret is not set. Please add repository secret 'EC2_USER' (ssh user)."
            exit 1
          fi
          if [ -z "${{ secrets.EC2_SSH_KEY || '' }}" ]; then
            echo "ERROR: EC2_SSH_KEY secret is not set. Please add repository secret 'EC2_SSH_KEY' (private key)."
            exit 1
          fi

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -eux
            TARGET_DIR=${{ secrets.EC2_PATH || '/home/ubuntu/tacticai' }}

            if [ -d "$TARGET_DIR/.git" ]; then
              cd "$TARGET_DIR" && git fetch --all && git reset --hard origin/main
            else
              rm -rf "$TARGET_DIR" || true
              git clone https://github.com/${{ github.repository }} "$TARGET_DIR"
            fi

            # If ENV_B64 secret is provided, restore .env
            if [ -n "${{ secrets.ENV_B64 || '' }}" ]; then
              echo "${{ secrets.ENV_B64 }}" | base64 -d > "$TARGET_DIR/.env"
            fi

            # Ensure docker is running
            if ! sudo systemctl is-active --quiet docker; then
              sudo systemctl start docker
            fi

            # Use docker compose to pull and restart
            sudo docker compose -f "$TARGET_DIR/docker-compose.yml" pull || true
            sudo docker compose -f "$TARGET_DIR/docker-compose.yml" up -d --build

            # Cleanup images
            sudo docker image prune -f
