name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: TacticAI
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -eux
            TARGET_DIR=${{ secrets.EC2_PATH || '/home/ubuntu/tacticai' }}

            # 1. Git clone or pull
            if [ -d "$TARGET_DIR/.git" ]; then
              cd "$TARGET_DIR" && git fetch --all && git reset --hard origin/develop
            else
              rm -rf "$TARGET_DIR" || true
              git clone --branch develop --single-branch https://github.com/${{ github.repository }} "$TARGET_DIR"
            fi

            # 2. Restore .env from secret
            if [ -n "${{ secrets.ENV_B64 || '' }}" ]; then
              echo "Restoring .env..."
              cd "$TARGET_DIR"
              printf '%s' "${{ secrets.ENV_B64 }}" | base64 -d > .env
              echo ".env restored ($(stat -c%s .env) bytes)"
              ls -la .env
            fi

            # 3. Docker build and run
            cd "$TARGET_DIR"
            sudo docker compose up -d --build --force-recreate

            # 4. Remove .env after deployment
            cd "$TARGET_DIR"
            if [ -f .env ]; then
              echo "Removing .env..."
              sudo rm -f .env
              echo ".env removed"
            fi
