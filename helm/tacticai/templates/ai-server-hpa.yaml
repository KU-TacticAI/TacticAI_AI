{{- if .Values.aiServer.enabled }}
{{- if .Values.aiServer.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-server
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-server
  minReplicas: {{ .Values.aiServer.hpa.minReplicas }}
  maxReplicas: {{ .Values.aiServer.hpa.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.aiServer.hpa.targetCPUUtilization }}
{{- end }}
{{- end }}
