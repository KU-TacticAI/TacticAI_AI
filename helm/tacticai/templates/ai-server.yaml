{{- if .Values.aiServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server
  namespace: {{ .Values.namespace }}
  labels:
    app: ai-server
spec:
  replicas: {{ .Values.aiServer.replicas }}
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector.gpu | nindent 8 }}
      containers:
      - name: ai-server
        image: {{ .Values.registry.host }}/{{ .Values.aiServer.image.repository }}:{{ .Values.aiServer.image.tag }}
        imagePullPolicy: {{ .Values.aiServer.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.aiServer.port }}
        env:
        {{- range $key, $value := .Values.aiServer.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        resources:
          limits:
            nvidia.com/gpu: {{ .Values.aiServer.resources.limits | dig "nvidia.com/gpu" 1 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-server
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: ai-server
  ports:
  - port: {{ .Values.aiServer.port }}
    targetPort: {{ .Values.aiServer.port }}
    nodePort: {{ .Values.aiServer.nodePort }}
{{- end }}
