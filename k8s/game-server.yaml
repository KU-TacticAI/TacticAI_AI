apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-server
  namespace: tacticai
  labels:
    app: game-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-server
  template:
    metadata:
      labels:
        app: game-server
    spec:
      nodeSelector:
        node-type: cpu
      containers:
      - name: game-server
        image: 192.168.0.18:5000/tacticai/game-server:develop
        imagePullPolicy: Always
        ports:
        - containerPort: 8002

---
apiVersion: v1
kind: Service
metadata:
  name: game-server
  namespace: tacticai
spec:
  type: NodePort
  selector:
    app: game-server
  ports:
  - port: 8002
    targetPort: 8002
    protocol: TCP
    nodePort: 30082
