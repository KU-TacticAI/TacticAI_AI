apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server
  namespace: tacticai
  labels:
    app: ai-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      nodeSelector:
        node-type: gpu
      containers:
      - name: ai-server
        image: 192.168.0.18:5000/tacticai/ai-server:develop
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        resources:
          limits:
            nvidia.com/gpu: 1

---
apiVersion: v1
kind: Service
metadata:
  name: ai-server
  namespace: tacticai
spec:
  type: NodePort
  selector:
    app: ai-server
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    nodePort: 30081
