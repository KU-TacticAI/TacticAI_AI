apiVersion: apps/v1
kind: Deployment
metadata:
  name: mq-api-gateway
  namespace: tacticai
  labels:
    app: mq-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mq-api-gateway
  template:
    metadata:
      labels:
        app: mq-api-gateway
    spec:
      nodeSelector:
        node-type: cpu
      containers:
      - name: mq-api-gateway
        image: 192.168.0.18:5000/tacticai/mq-api-gateway:develop
        imagePullPolicy: Always
        ports:
        - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: mq-api-gateway
  namespace: tacticai
spec:
  type: NodePort
  selector:
    app: mq-api-gateway
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    nodePort: 30080
