version: '3.8'

# 모든 외부 서비스(RabbitMQ, MySQL, MongoDB, Redis)는 별도 서버에서 운영
# 이 Docker Compose는 애플리케이션 서비스들만 관리

services:
  # MQ API Gateway
  mq-api-gateway:
    build: ./mq_api_gateway
    container_name: tacticai-mq-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env

  # Game Server
  game-server:
    build: ./game_server
    container_name: tacticai-game-server
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file: .env

  # AI Server
  ai-server:
    build: ./ai_server
    container_name: tacticai-ai-server
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file: .env
    # GPU 지원 활성화
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  tacticai-network:
    driver: bridge

# 모든 데이터베이스와 서비스는 외부에서 운영
